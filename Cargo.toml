[workspace]
members = [
    "crates/protocol",
    "crates/event-service",
    "crates/remote",
    "crates/hypersync",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KaiCode2/evm-fork-cache-hypersync"
homepage = "https://github.com/KaiCode2/evm-fork-cache-hypersync"

[workspace.dependencies]
alloy-consensus = ">=1.1.2, <1.7"
alloy-eips = ">=1.0.38, <1.7"
alloy-network = ">=1.0.38, <1.7"
alloy-primitives = ">=1.4, <1.7"
alloy-provider = ">=1.0.38, <1.7"
alloy-rlp = "0.3"
alloy-rpc-types-eth = ">=1.0.38, <1.7"
anyhow = "1.0.98"
async-trait = "0.1.89"
crc32fast = "1.4"
criterion = "0.8.2"
evm-fork-cache = { version = "=0.4.0-alpha.4", default-features = false, features = ["reactive"] }
evm-fork-cache-event-protocol = { version = "=0.1.0-alpha.1", path = "crates/protocol" }
evm-fork-cache-event-service = { version = "=0.1.0-alpha.1", path = "crates/event-service" }
evm-fork-cache-remote = { version = "=0.1.0-alpha.1", path = "crates/remote" }
futures = "0.3.31"
hypersync-client = "1.4.0"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rusqlite = { version = ">=0.39, <0.40", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["tls-native-roots", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
